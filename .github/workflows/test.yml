name: Test

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      SWIFT_TESTING_PLUGIN_PATH: /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/host/plugins/testing
    steps:
      - uses: actions/checkout@v6
      - name: Show Swift toolchain
        run: swift --version
      - name: Test release orchestration
        run: |
          brew install just
          python3 -B -m unittest discover -s scripts/tests -v
      - name: Run tests
        run: swift test
